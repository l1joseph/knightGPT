# k8s/nrp/postgres-cluster.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knightgpt-postgres-data
  namespace: knightlab-ml
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: linstor-igrok
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knightgpt-postgres
  namespace: knightlab-ml
spec:
  replicas: 1
  strategy:
    type: Recreate  # RWO volume -- avoid two pods ever trying to mount it during a rolling update
  selector:
    matchLabels:
      app: knightgpt-postgres
  template:
    metadata:
      labels:
        app: knightgpt-postgres
    spec:
      containers:
        - name: postgres
          image: ghcr.io/l1joseph/knightgpt-postgres:latest
          imagePullPolicy: Always
          # No `command:` override here (deviation from the task brief): the image's own
          # Dockerfile (docker/postgres/Dockerfile) already bakes in
          # CMD ["postgres", "-c", "shared_preload_libraries=graph"] and inherits
          # postgres:17-bookworm's ENTRYPOINT ["docker-entrypoint.sh"]. Kubernetes `command:`
          # overrides the container ENTRYPOINT (not just CMD), which bypassed
          # docker-entrypoint.sh's privilege-drop (gosu postgres) and caused
          # `"root" execution of the PostgreSQL server is not permitted` CrashLoopBackOff.
          # Leaving both command/args unset lets the image's own correct ENTRYPOINT+CMD run.
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: knightgpt
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: knightgpt-postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata  # subdirectory, not the mount root -- the vanilla postgres image's initdb refuses a non-empty mount root (e.g. a lost+found dir some storage backends create), this is the documented workaround
          resources:  # required by this namespace's Gatekeeper admission policy (container-must-have-limits-and-requests); not present in the original task brief, added after `kubectl apply` was denied -- see task-2-report.md for the exact error
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: knightgpt-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: knightgpt-postgres
  namespace: knightlab-ml
spec:
  selector:
    app: knightgpt-postgres
  ports:
    - port: 5432
      targetPort: 5432
