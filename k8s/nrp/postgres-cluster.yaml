# k8s/nrp/postgres-cluster.yaml
#
# The PersistentVolumeClaim for this Deployment lives in its own file,
# k8s/nrp/postgres-pvc.yaml (see that file for why: `kubectl delete -f` on a
# file containing both the PVC and the Deployment would delete the PVC too,
# and both this PVC's storage class (linstor-igrok) and the backup dest PVC's
# storage class have reclaimPolicy: Delete -- irreversible data loss).
# Apply both files together: `kubectl apply -f k8s/nrp/postgres-pvc.yaml -f k8s/nrp/postgres-cluster.yaml`
apiVersion: apps/v1
kind: Deployment
metadata:
  name: knightgpt-postgres
  namespace: knightlab-ml
spec:
  replicas: 1
  revisionHistoryLimit: 0  # prevents `kubectl rollout undo` from ever reintroducing a stale
                            # ReplicaSet -- e.g. an earlier ReplicaSet from a bad `command:`
                            # override that bypassed docker-entrypoint.sh's privilege drop and
                            # CrashLoopBackOff'd as root. With this at 0, no old ReplicaSets are
                            # retained for rollback in the first place.
  strategy:
    type: Recreate  # RWO volume -- avoid two pods ever trying to mount it during a rolling update
  selector:
    matchLabels:
      app: knightgpt-postgres
  template:
    metadata:
      labels:
        app: knightgpt-postgres
    spec:
      terminationGracePeriodSeconds: 60  # default (30s) is too short for Postgres "smart shutdown"
                                          # waiting on idle connections (e.g. HybridRetriever's
                                          # asyncpg pool holds pool_min_size: 2 idle connections at
                                          # rest per src/utils/config.py). The preStop hook below
                                          # forces a fast shutdown well within this window so we
                                          # don't actually need the full 60s in practice, but it's
                                          # kept as headroom in case the preStop hook itself is slow.
      containers:
        - name: postgres
          # Pinned to an immutable sha tag, NOT :latest. This must be bumped deliberately (never
          # automatically / via a `latest`-tracking policy) because this is a stateful service
          # running against a live PGDATA directory: an unplanned pgGraph version change on pod
          # restart could corrupt or break compatibility with the existing on-disk data. Confirmed
          # via the GHCR tag list that this sha tag is the current `latest` build (same digest,
          # sha256:aad3dec8...096a312) as of 2026-08-05.
          image: ghcr.io/l1joseph/knightgpt-postgres:sha-d5e0036c516074f9c9b9e863d77aa469adb783b0
          imagePullPolicy: IfNotPresent  # safe because the tag above is immutable (sha-pinned) --
                                          # a given tag can never point at different image content,
                                          # so there's never a need to re-pull an already-cached tag
          # No `command:` override here (deviation from the task brief): the image's own
          # Dockerfile (docker/postgres/Dockerfile) already bakes in
          # CMD ["postgres", "-c", "shared_preload_libraries=graph"] and inherits
          # postgres:17-bookworm's ENTRYPOINT ["docker-entrypoint.sh"]. Kubernetes `command:`
          # overrides the container ENTRYPOINT (not just CMD), which bypassed
          # docker-entrypoint.sh's privilege-drop (gosu postgres) and caused
          # `"root" execution of the PostgreSQL server is not permitted` CrashLoopBackOff.
          # Leaving both command/args unset lets the image's own correct ENTRYPOINT+CMD run.
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: knightgpt
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: knightgpt-postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata  # subdirectory, not the mount root -- the vanilla postgres image's initdb refuses a non-empty mount root (e.g. a lost+found dir some storage backends create), this is the documented workaround
          resources:  # required by this namespace's Gatekeeper admission policy (container-must-have-limits-and-requests); not present in the original task brief, added after `kubectl apply` was denied -- see task-2-report.md for the exact error
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          lifecycle:
            preStop:
              exec:
                # Forces a fast (not smart) shutdown on pod termination. SIGTERM alone triggers
                # Postgres's "smart shutdown", which waits indefinitely for idle client
                # connections (e.g. HybridRetriever's pool) to disconnect on their own -- with
                # nothing forcing that, kubelet would eventually SIGKILL at the
                # terminationGracePeriodSeconds deadline instead of a clean shutdown.
                # lifecycle hooks run as the container's process user, which is root (this
                # image's entrypoint runs as root and only gosu-drops privilege for the
                # postmaster itself) -- pg_ctl refuses to run as root, so this must be run via
                # gosu postgres, same as docker-entrypoint.sh does internally. Confirmed
                # gosu is present at /usr/local/bin/gosu in this image.
                #
                # NOTE (tested 2026-08-05): kubelet still logs a `FailedPreStopHook` event on
                # every termination even with this gosu fix, both with and without `-w`. This
                # is a separate, structural artifact, not a functional failure: postgres is
                # this container's PID 1 (no init/supervisor process), so the moment this
                # hook's SIGINT reaches it and it begins exiting, the container's process
                # namespace is torn down -- which kills the hook's own exec session as
                # collateral before it can report success back to kubelet, even though the
                # fast shutdown it triggered completes correctly. Confirmed via the
                # container's own postgres logs after a manual trigger: "received fast
                # shutdown request" -> checkpoint -> "database system is shut down" -- a
                # fully clean sequence -- and via repeated pod-deletion tests where the
                # `FailedPreStopHook` event fires within ~1s of the `Killing` event, not
                # after the 60s terminationGracePeriodSeconds (which would indicate a real
                # fallback to SIGKILL). Eliminating the event entirely would require an
                # init/supervisor process (e.g. tini) ahead of postgres as PID 1 in
                # docker/postgres/Dockerfile -- a separate, Dockerfile-level change, out of
                # scope here. -w is kept because it gives a synchronous confirmation
                # semantics if a future, slower shutdown scenario arises.
                command: ["/bin/sh", "-c", "gosu postgres pg_ctl -D \"$PGDATA\" -m fast -w stop"]
          readinessProbe:
            # Closes a real, measured gap: without this, the Service routes traffic to a pod
            # that's Running but not yet accepting connections (~42s window observed after pod
            # start) -- HybridRetriever.__init__ builds its connection pool eagerly with no
            # retry logic, so any consumer starting during that window would hard-fail.
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "knightgpt"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "knightgpt"]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: knightgpt-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: knightgpt-postgres
  namespace: knightlab-ml
spec:
  selector:
    app: knightgpt-postgres
  ports:
    - port: 5432
      targetPort: 5432
