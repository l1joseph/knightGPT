# k8s/nrp/postgres-pvc.yaml
#
# WARNING: deleting this resource (or this file, via `kubectl delete -f`) is
# IRREVERSIBLE and destroys all Postgres data. The `linstor-igrok` storage
# class has reclaimPolicy: Delete, so removing this PVC deletes the
# underlying volume too -- there is no recycle bin. This is intentionally
# kept in its own file, separate from k8s/nrp/postgres-cluster.yaml (the
# Deployment + Service), specifically so that a routine
# `kubectl delete -f k8s/nrp/postgres-cluster.yaml` cleanup of the app tier
# can never take this PVC down with it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: knightgpt-postgres-data
  namespace: knightlab-ml
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: linstor-igrok
  resources:
    requests:
      storage: 20Gi
