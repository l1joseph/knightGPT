# Local proof-test overrides for running the real stack via rootless
# podman on Cosmos, ahead of the real kl-remote deploy. NOT used by the
# real deploy -- kl-remote runs docker/docker-compose.yaml directly.
# Overrides only what differs here: volume host paths (the base file's
# postgres pgdata path, /sdsc/scc/ddp478/..., isn't valid on Cosmos or
# apparently anywhere else currently reachable -- flagged separately,
# not fixed here, since fixing the base file's path is a real but
# separate cleanup this plan didn't scope).
#
# pull_policy: never -- both postgres and api are build-only services
# (no `image:` key in the base compose file). podman-compose 1.6.0's
# pre-create pull step (podman_compose.py's prepare_images/pull_images,
# meant "to minimize downtime ... ensuring the image is already cached")
# was observed synthesizing a project-scoped tag ("docker_postgres",
# "docker_api" -- <project>_<service>) and trying to PULL that from the
# registry before the build ever ran, failing with "manifest unknown"
# against registry.suse.com (this host's unqualified-search-registries
# default, confirmed in /etc/containers/registries.conf) since that tag
# only ever exists locally after a build. pull_policy: never (part of
# the Compose Spec, honored by podman-compose's pull_image()) skips that
# pre-pull entirely and goes straight to build, which is the correct
# behavior for a service with no remote image to pull.
services:
  postgres:
    pull_policy: never
    volumes:
      - /cosmos/vast/scratch/l1joseph/knightgpt/podman-test-pgdata:/var/lib/postgresql/data
      - /cosmos/vast/scratch/l1joseph/knightgpt/deploy/knightgpt-postgres-20260904-024751.dump:/docker-entrypoint-initdb.d/backup.dump:ro
  api:
    pull_policy: never
    volumes:
      - /cosmos/vast/scratch/l1joseph/knightgpt/podman-test-duckdb:/app/duckdb_data
